services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: radar_dev
      POSTGRES_DB: radar
    ports:
      - "5432:5432"
    volumes:
      - radar_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar -d radar"]
      interval: 5s
      timeout: 3s
      retries: 10

  bot:
    build: .
    env_file: .env
    environment:
      RADAR_DSN: postgresql://radar:radar_dev@db:5432/radar
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./evidencia:/app/evidencia

volumes:
  radar_pgdata:
